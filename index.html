<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOUCHLINE 26/27 — Tres Pilares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A12;--bg2:#0C1120;--panel:#121A2B;--panel2:#1A2337;--panel3:#232E46;
  --line:#26314A;--line2:#334261;--txt:#EAF0FA;--dim:#8798BA;--dim2:#5F6E8C;
  --acc:#4CC2FF;--gold:#FFC145;--win:#2BD98A;--draw:#C9B458;--lose:#FF5C7A;
  --disp:'Anton','Haettenschweiler','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(900px 420px at 15% -8%,rgba(76,194,255,.10),transparent 65%),
                   radial-gradient(700px 380px at 88% -4%,rgba(255,193,69,.07),transparent 62%)}
h1,h2,h3,h4,.disp{font-family:var(--disp);text-transform:uppercase;font-weight:400;letter-spacing:.012em;line-height:.98}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:9px}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 96px}
.top{position:sticky;top:0;z-index:40;background:rgba(7,10,18,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:11px}
.top .club{font-family:var(--disp);font-size:21px;line-height:1}
.top .meta{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;font-weight:600}
.top .caja{margin-left:auto;text-align:right;flex:none}
.top .caja b{font-family:var(--mono);font-size:15px;color:var(--gold);display:block;font-weight:700}
.nav{max-width:1120px;margin:0 auto;padding:0 9px;display:flex;gap:1px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{font-family:var(--disp);font-size:14.5px;letter-spacing:.05em;color:var(--dim);padding:9px 13px 8px;
  border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;transition:.13s}
.nav button:hover{color:var(--txt)}
.nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
.nav .badge{background:var(--lose);color:#fff;font-family:var(--mono);font-size:10px;padding:0 4px;border-radius:6px;margin-left:4px;vertical-align:1px}
.card{background:linear-gradient(180deg,var(--panel),#101726);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-top:14px}
.card.tight{padding:11px}
.card>h3,.h{font-size:17px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.eyebrow{font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.17em;color:var(--dim2);text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sp{margin-left:auto}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-family:var(--disp);
  font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;transition:.13s;display:inline-block}
.btn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(180deg,#5ECDFF,#249FE0);color:#04121D;border-color:#5ECDFF}
.btn.pri:hover{filter:brightness(1.1);color:#04121D;border-color:#8adcff}
.btn.gold{background:linear-gradient(180deg,#FFD46B,#E8A62A);color:#241703;border-color:#FFD46B}
.btn.gold:hover{color:#241703;filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:6px}
.btn.gh{background:none}
.btn[disabled]{opacity:.32;cursor:not-allowed;transform:none!important;border-color:var(--line)!important;color:inherit!important}
select,input{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px}
input::placeholder{color:var(--dim2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--dim2);text-align:left;
  padding:6px 5px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
td{padding:7px 5px;border-bottom:1px solid rgba(38,49,74,.55);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.me td{background:rgba(76,194,255,.09)}
tr.k{cursor:pointer}tr.k:hover td{background:rgba(76,194,255,.07)}
.c{text-align:center}.r{text-align:right}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}.sm{font-size:12.5px}.xs{font-size:11px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.crest{width:34px;height:34px;border-radius:7px 7px 10px 10px;flex:none;position:relative;overflow:hidden;
  display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22),0 2px 6px rgba(0,0,0,.4)}
.crest span{font-family:var(--disp);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);position:relative;z-index:2}
.crest i{position:absolute;inset:0;z-index:1}
.tag{display:inline-block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.06em;padding:2px 6px;border-radius:5px;
  background:var(--panel2);border:1px solid var(--line2);text-transform:uppercase}
.t-POR{background:#3B2A05;color:#FFD166;border-color:#5C4409}
.t-DEF{background:#052B3E;color:#7FD4FF;border-color:#0E4867}
.t-MED{background:#0B3125;color:#5FE0A6;border-color:#155840}
.t-DEL{background:#3A1020;color:#FF93A9;border-color:#5F1B31}
.ov{font-family:var(--mono);font-weight:700}
.o90{color:#FFD166}.o80{color:var(--win)}.o70{color:var(--acc)}.o60{color:var(--txt)}.o50{color:var(--dim)}
.bar{height:5px;border-radius:4px;background:#0A0F1B;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.pill{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-family:var(--disp);font-size:12px;margin-right:2px}
.pV{background:rgba(43,217,138,.16);color:var(--win)}.pE{background:rgba(201,180,88,.16);color:var(--draw)}.pD{background:rgba(255,92,122,.16);color:var(--lose)}
.chipn{display:inline-block;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:2px 9px;font-size:11.5px;margin:0 3px 3px 0}
.note{background:rgba(76,194,255,.08);border:1px solid rgba(76,194,255,.3);border-radius:9px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.note.bad{background:rgba(255,92,122,.09);border-color:rgba(255,92,122,.32)}
.note.good{background:rgba(43,217,138,.09);border-color:rgba(43,217,138,.32)}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.kpi b{font-family:var(--disp);font-size:25px;display:block;line-height:1}
.kpi span{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.pitch{position:relative;width:100%;max-width:500px;aspect-ratio:68/100;margin:0 auto;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 5%,transparent 5% 10%),
             radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.10),transparent 55%),
             linear-gradient(178deg,#23875A 0%,#1B7A4E 45%,#12563A 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 8px 30px rgba(0,0,0,.5)}
.ln{position:absolute;border:2px solid rgba(255,255,255,.30)}
.spot{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
.pl{position:absolute;transform:translate(-50%,-50%);width:56px;text-align:center;cursor:pointer;z-index:3}
.pl .sh{width:36px;height:36px;margin:0 auto;border-radius:50%;background:rgba(8,12,20,.85);border:2px solid var(--acc);
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--acc);transition:.15s;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.pl.empty .sh{border-style:dashed;border-color:rgba(255,255,255,.45);color:rgba(255,255,255,.5)}
.pl.on .sh{background:var(--acc);color:#04121D;transform:scale(1.14)}
.pl.warn .sh{border-color:var(--lose);color:var(--lose)}
.pl .nm{font-size:10.5px;line-height:1.15;margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pl .rl{font-size:9px;font-weight:700;letter-spacing:.08em;color:#BFF0D6;text-shadow:0 1px 3px #000}
.board{background:linear-gradient(160deg,#0D1526,#070B14);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.board .strip{display:flex;align-items:stretch;background:linear-gradient(90deg,rgba(76,194,255,.14),transparent 60%)}
.board .side{flex:1;padding:13px 12px;display:flex;align-items:center;gap:9px;min-width:0}
.board .side.a{justify-content:flex-end;text-align:right}
.board .side .nm{font-family:var(--disp);font-size:16px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{flex:none;padding:11px 15px;background:rgba(255,255,255,.05);border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;min-width:112px}
.board .sc b{font-family:var(--disp);font-size:38px;line-height:.92;display:block}
.board .sc span{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:700}
.mom{height:7px;display:flex;background:var(--panel2)}
.mom i{display:block;height:100%;transition:width .5s}
.stat{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12.5px}
.stat .b{flex:1;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;display:flex}
.stat .b i{display:block;height:100%}
.feed{max-height:300px;overflow-y:auto}
.ev{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(38,49,74,.5);font-size:14px;align-items:flex-start;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.ev .mn{font-family:var(--mono);color:var(--dim2);min-width:36px;font-size:12.5px;font-weight:700;padding-top:1px}
.ev.g{background:linear-gradient(90deg,rgba(255,193,69,.14),transparent);border-radius:6px}
.ev.g .tx{color:var(--gold);font-weight:600}
.ev.r .tx{color:var(--lose)}
@keyframes flash{0%{transform:scale(1)}28%{transform:scale(1.16);color:var(--gold)}100%{transform:scale(1)}}
.board .sc b.flash{animation:flash .75s ease}
.veil{position:fixed;inset:0;background:rgba(4,7,13,.82);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:linear-gradient(180deg,var(--panel),#0E1523);border:1px solid var(--line2);border-radius:14px;max-width:540px;width:100%;
  padding:18px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.65);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal.wide{max-width:720px}
.x{float:right;font-size:24px;line-height:1;color:var(--dim);padding:0 5px;margin:-4px -4px 0 0}
.hero{padding:30px 0 6px}
.hero .kick{font-weight:700;letter-spacing:.3em;font-size:11px;color:var(--acc);text-transform:uppercase}
.hero h1{font-size:clamp(48px,12vw,104px);line-height:.82;margin:8px 0 0}
.hero h1 em{font-style:normal;-webkit-text-stroke:1.5px var(--acc);color:transparent}
.hero p{color:var(--dim);max-width:560px;margin-top:14px;font-size:15.5px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-top:12px}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;gap:10px;align-items:center;text-align:left;transition:.14s;width:100%}
.pk:hover{border-color:var(--acc);transform:translateY(-2px);background:var(--panel2)}
.pk .nm{font-family:var(--disp);font-size:15.5px;line-height:1.02}
.pk .sub{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.stars{color:var(--gold);font-size:11px;letter-spacing:1.5px}
.stars s{color:var(--line2);text-decoration:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(7,10,18,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line2)}
.dock .in{max-width:1120px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:12px}
.dock .t{font-size:12.5px;color:var(--dim);line-height:1.25;min-width:0}
.dock .t b{color:var(--txt);font-family:var(--disp);font-size:15px;display:block;text-transform:uppercase}
.tr{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(38,49,74,.5)}
.tr .ar{color:var(--dim2);font-size:13px}
.tr .pr{font-family:var(--mono);font-weight:700;color:var(--gold);margin-left:auto;white-space:nowrap}
.lgpills{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.lgpills::-webkit-scrollbar{display:none}
.arco{position:relative;width:100%;max-width:430px;margin:0 auto;aspect-ratio:3/1.55;
 background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
 border:4px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;
 box-shadow:0 6px 26px rgba(0,0,0,.5);overflow:hidden}
.arco::after{content:'';position:absolute;inset:0;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 1px,transparent 1px 13px),
            repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 1px,transparent 1px 13px);pointer-events:none}
.zonas{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px;padding:5px;z-index:2}
.zona{border:2px dashed rgba(255,255,255,.30);border-radius:7px;cursor:pointer;transition:.13s;
 display:grid;place-items:center;font-family:var(--disp);font-size:12px;color:rgba(255,255,255,.55)}
.zona:hover{background:rgba(76,194,255,.28);border-color:var(--acc);color:#fff;transform:scale(1.04)}
.zona.pick{background:rgba(255,193,69,.4);border-color:var(--gold);border-style:solid;color:#fff}
.penMarcador{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.penTiro{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;
 border:2px solid var(--line2);background:var(--panel2)}
.penTiro.gol{background:rgba(43,217,138,.25);border-color:var(--win)}
.penTiro.fallo{background:rgba(255,92,122,.22);border-color:var(--lose)}
.penTiro.turno{border-color:var(--gold);animation:latir 1s infinite}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
#golFX{position:fixed;inset:0;z-index:95;pointer-events:none;display:none}
#golFX.on{display:block}
#golFX .destello{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,193,69,.5),transparent 62%);animation:fxflash 1.15s ease}
#golFX .grito{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);
 font-size:clamp(46px,15vw,120px);letter-spacing:.02em;color:var(--gold);
 text-shadow:0 6px 34px rgba(0,0,0,.9),0 0 60px rgba(255,193,69,.55);animation:fxgrito 1.6s cubic-bezier(.2,1.4,.4,1)}
#golFX .quien{position:absolute;left:0;right:0;top:56%;text-align:center;font-family:var(--disp);
 font-size:clamp(17px,4.5vw,30px);color:#fff;text-shadow:0 3px 16px #000;animation:fxquien 1.6s ease}
#golFX .conf{position:absolute;width:9px;height:14px;border-radius:2px;top:-6%;animation:fxcae linear forwards}
@keyframes fxflash{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
@keyframes fxgrito{0%{opacity:0;transform:scale(.4) rotate(-6deg)}26%{opacity:1;transform:scale(1.08) rotate(0)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}}
@keyframes fxquien{0%{opacity:0;transform:translateY(16px)}30%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@keyframes fxcae{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(115vh) rotate(720deg);opacity:.15}}
.golpe{animation:golpe .6s cubic-bezier(.3,1.6,.4,1)}
@keyframes golpe{0%{transform:scale(1)}35%{transform:scale(1.3);color:var(--gold)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* ===== TOUCHLINE EXPANSIÓN TOTAL ===== */
.tlx-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.75fr);gap:14px;margin-top:14px}
@media(max-width:860px){.tlx-grid{grid-template-columns:1fr}}
.tlx-sim-pitch{position:relative;aspect-ratio:100/64;min-height:300px;border-radius:12px;overflow:hidden;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 10%,transparent 10% 20%),linear-gradient(180deg,#218258,#145b3d);
 box-shadow:inset 0 0 50px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.16)}
.tlx-sim-pitch:before{content:"";position:absolute;inset:5%;border:2px solid rgba(255,255,255,.32);pointer-events:none}
.tlx-sim-pitch:after{content:"";position:absolute;left:50%;top:5%;bottom:5%;border-left:2px solid rgba(255,255,255,.30);pointer-events:none}
.tlx-circle{position:absolute;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);
 font:700 9px var(--mono);transition:left .18s linear,top .18s linear,transform .18s;z-index:3;box-shadow:0 2px 7px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.82)}
.tlx-circle.home{background:var(--acc);color:#04121D}.tlx-circle.away{background:var(--lose);color:#fff}.tlx-circle.ball{width:10px;height:10px;background:#fff;border:1px solid #222;z-index:5}
.tlx-circle.onball{transform:translate(-50%,-50%) scale(1.22);box-shadow:0 0 0 4px rgba(255,255,255,.15),0 2px 8px #000}
.tlx-score-row{display:grid;grid-template-columns:1fr 48px 1fr;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(38,49,74,.5);font-size:12px}
.tlx-score-row:last-child{border:0}.tlx-score-row .l{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tlx-score-row .r{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tlx-score-row .s{text-align:center;font-family:var(--mono);font-weight:700}
.tlx-live-table{max-height:330px;overflow:auto}.tlx-rise{color:var(--win)}.tlx-fall{color:var(--lose)}
.tlx-tag-live{animation:tlxpulse 1.1s infinite}@keyframes tlxpulse{50%{opacity:.55}}
.tlx-choice{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:9px;text-align:left;transition:.13s}.tlx-choice:hover{border-color:var(--acc);transform:translateY(-1px)}
.tlx-chart{width:100%;height:185px;display:block;background:rgba(7,10,18,.45);border:1px solid var(--line);border-radius:10px}
.tlx-role{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tlx-fin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:650px){.tlx-fin{grid-template-columns:1fr}}
.tlx-provisional tr.me td{box-shadow:inset 3px 0 0 var(--acc)}
.tlx-dramatic{background:linear-gradient(100deg,rgba(255,193,69,.16),rgba(255,92,122,.10));border-color:rgba(255,193,69,.4)}


/* ===== TOUCHLINE 3 PILARES ===== */
.tl3-decision{border-left:3px solid var(--acc)}
.tl3-alert{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(38,49,74,.55)}
.tl3-alert:last-child{border-bottom:0}.tl3-alert b{display:block}.tl3-alert .ico{font-size:18px;line-height:1}

.tl3-clubnav{display:flex;gap:5px;overflow:auto;margin-top:12px}.tl3-compact-details{margin-top:14px}.tl3-compact-details summary{cursor:pointer;color:var(--dim);font-weight:700}.tl3-compact-details[open] summary{color:var(--acc)}
.tl3-identity{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tl3-mini{font-size:11px;color:var(--dim2)}
@media(max-width:700px){.tl3-pitch{min-height:270px}.tl3-token{width:22px;height:22px;font-size:7.5px}}

function roundRobin(n){
  const eq=[...Array(n).keys()],rd=[];
  for(let r=0;r<n-1;r++){
    const par=[];
    for(let i=0;i<n/2;i++){const a=eq[i],b=eq[n-1-i];par.push(r%2===0?[a,b]:[b,a])}
    rd.push(par);eq.splice(1,0,eq.pop());
  }
  return rd;
}
function calendarioLiga(l){
  const ids=G.clubes.filter(c=>c.liga===l).map(c=>c.id);
  for(let i=ids.length-1;i>0;i--){const j=ri(0,i);[ids[i],ids[j]]=[ids[j],ids[i]]}
  const ida=roundRobin(ids.length).map(r=>r.map(p=>[ids[p[0]],ids[p[1]]]));
  /* ligas de más de 20 equipos (Argentina) juegan una sola rueda, como en la realidad */
  let cal=ids.length>20?ida.slice():[...ida,...ida.map(r=>r.map(p=>[p[1],p[0]]))];
  while(cal.length<38){const at=Math.round((cal.length)*(cal.length/38)*.5)+ri(3,30);cal.splice(Math.min(at,cal.length),0,[])}
  return cal.slice(0,38);
}

  if(!sel.includes(G.yo)){sel[sel.length-1]=G.yo}
  sel=sel.sort(()=>Math.random()-.5);

/* Fase de liga estilo UEFA 2024+: tabla única, cada club juega N rivales distintos */
function sorteoFaseLiga(ids,jornadas){
  const eq=ids.slice();
  const tabla={};eq.forEach(id=>tabla[id]={id,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0});
  /* emparejamiento perfecto por jornada: reintenta hasta que no queden equipos sueltos */
  const armarRonda=(usados,j)=>{
    for(let intento=0;intento<400;intento++){
      const libres=eq.slice().sort(()=>Math.random()-.5),par=[],tomados=new Set();
      let ok=true;
      for(const a of libres){
        if(tomados.has(a))continue;
        const cand=libres.filter(b=>b!==a&&!tomados.has(b)&&!usados[a].has(b));
        if(!cand.length){ok=false;break}
        const b=cand[Math.floor(Math.random()*cand.length)];
        tomados.add(a);tomados.add(b);
        par.push(j%2===0?[a,b]:[b,a]);
      }
      if(ok&&par.length===eq.length/2)return par;
    }
    return null;
  };
  for(let reinicio=0;reinicio<30;reinicio++){
    const usados={};eq.forEach(id=>usados[id]=new Set());
    const rondas=[];let fallo=false;
    for(let j=0;j<jornadas;j++){
      const par=armarRonda(usados,j);
      if(!par){fallo=true;break}
      par.forEach(([a,b])=>{usados[a].add(b);usados[b].add(a)});
      rondas.push(par);
    }
    if(!fallo)return {tabla,rondas};
  }
  /* red de seguridad: round-robin recortado */
  const rr=roundRobin(eq.length).slice(0,jornadas).map(r=>r.map(p=>[eq[p[0]],eq[p[1]]]));
  return {tabla,rondas:rr};
}
function sorteoGrupos(ids,nGrupos){
  const eq=ids.slice().sort(()=>Math.random()-.5);
  const grupos=[];
  for(let g=0;g<nGrupos;g++)grupos.push(eq.slice(g*4,g*4+4));
  const tabla={};eq.forEach(id=>tabla[id]={id,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,grupo:Math.floor(eq.indexOf(id)/4)});
  grupos.forEach((g,gi)=>g.forEach(id=>{if(tabla[id])tabla[id].grupo=gi}));
  /* 3 fechas de ida + 3 de vuelta dentro de cada grupo */
  const patron=[[[0,3],[1,2]],[[2,0],[3,1]],[[0,1],[2,3]]];
  const rondas=[];
  for(let v=0;v<2;v++)for(let f=0;f<3;f++){
    const par=[];
    grupos.forEach(g=>{
      if(g.length<4)return;
      patron[f].forEach(([x,y])=>par.push(v===0?[g[x],g[y]]:[g[y],g[x]]));
    });
    rondas.push(par);
  }
  return {grupos,tabla,rondas};
}

function cerrarGrupos(T){
  const primeros=[],segundos=[],terceros=[];
  for(let g=0;g<T.grupos.length;g++){
    const t=tablaGrupo(T,g);
    if(t[0])primeros.push(t[0].id);
    if(t[1])segundos.push(t[1].id);
    if(t[2])terceros.push(t[2].id);
  }
  let clas;
  if(T.key==='lib'){
    /* Libertadores: pasan los dos primeros. Los terceros bajan a la Sudamericana. */
    clas=primeros.concat(segundos);

  }else{

    clas=primeros.slice();

    if(cruces.length){
      T.fase='playoff';T.ronda=0;T.llaves=cruces;T.clasificadosDirecto=clas;
      if(clas.includes(G.yo))news(T.nombre+': a octavos directo','Ganaste tu grupo y te salteás el playoff.','bien');
      else if(cruces.some(p=>p.includes(G.yo)))news(T.nombre+': al playoff','Terminaste segundo: hay que cruzar para entrar en octavos.','info');
      else if(T.equipos.includes(G.yo))news(T.nombre+': eliminados','Se terminó en la fase de grupos.','mal');
      return;
    }
  }
  T.fase='octavos';T.ronda=1;
  const mez=clas.slice().sort(()=>Math.random()-.5);

/* ---- eliminatorias a ida y vuelta ---- */
function conmebolLeg(T,k,etapa,leg,resultados){
  /* resultados: [{p:[a,b], st}] con el orden de la llave tal como se jugó */
  T.parciales=T.parciales||{};
  if(leg==='ida'){
    resultados.forEach((x,i)=>{T.parciales[i]={a:x.st.l,b:x.st.v}});
    T.hist.push({ronda:T.ronda,leg:'ida',par:resultados.map(x=>({p:x.p,l:x.st.l,v:x.st.v}))});
    return null;
  }
  const gan=[];
  const detalle=[];
  resultados.forEach((x,i)=>{
    const ida=T.parciales[i]||{a:0,b:0};
    /* en la vuelta se invierte la localía: x.p = [visitante de ida, local de ida] */
    const globalA=ida.a+x.st.v;   // el equipo que fue local en la ida
    const globalB=ida.b+x.st.l;
    let ganador;
    if(globalA>globalB)ganador=x.p[1];
    else if(globalB>globalA)ganador=x.p[0];
    else ganador=x.st.pen?(x.st.pen[0]>x.st.pen[1]?x.p[0]:x.p[1]):(Math.random()<.5?x.p[0]:x.p[1]);
    gan.push(ganador);
    detalle.push({p:x.p,l:x.st.l,v:x.st.v,glob:[globalB,globalA],pen:x.st.pen||null});
  });
  T.hist.push({ronda:T.ronda,leg:'vuelta',par:detalle});
  T.parciales={};
  return gan;
}

function cerrarFaseLiga(T){

function apto(p){return p&&!p.les&&!p.san}
function autoOnce(c){
  const slots=FORM[c.tac.form];
  const libres=c.plantilla.map(id=>G.j[id]).filter(apto);
  const usados=new Set(),asig=new Array(11).fill(null);
  const pr={POR:0,DFC:1,LD:2,LI:2,MCD:3,DC:4,MCO:5,ED:6,EI:6,MC:7};
  slots.map((s,i)=>i).sort((a,b)=>pr[slots[a][0]]-pr[slots[b][0]]).forEach(i=>{
    let mej=null,mv=-1;
    libres.forEach(p=>{if(usados.has(p.id))return;
      const v=ovEn(p,slots[i][0])*(.72+.28*p.con/100);
      if(v>mv){mv=v;mej=p}});
    if(mej){usados.add(mej.id);asig[i]=mej.id}
  });
  for(let it=0;it<3;it++)for(let a=0;a<11;a++)for(let b=a+1;b<11;b++){
    if(!asig[a]||!asig[b])continue;
    const pa=G.j[asig[a]],pb=G.j[asig[b]];
    if(ovEn(pb,slots[a][0])+ovEn(pa,slots[b][0])>ovEn(pa,slots[a][0])+ovEn(pb,slots[b][0])+.5){
      const t=asig[a];asig[a]=asig[b];asig[b]=t}
  }
  c.once=asig;return asig;
}
function onceOk(c){return c.once.length===11&&c.once.every(id=>id&&G.j[id]&&apto(G.j[id])&&c.plantilla.includes(id))}
function ovOnce(c){

  return n?Math.round(t/n):0;
}

function fuerza(c,local){
  const slots=FORM[c.tac.form];
  let d=0,dw=0,m=0,mw=0,a=0,aw=0,gk=55,lid=0;
  c.once.forEach((id,i)=>{
    const p=G.j[id];if(!p)return;
    let v=ovEn(p,slots[i][0]);
    if(tieneRasgo(p,'Veloz'))v+=1.5;
    if(tieneRasgo(p,'Muralla')&&slots[i][0]==='POR')v+=3;
    if(tieneRasgo(p,'Ancla')&&GRUPO[slots[i][0]]==='DEF')v+=2;
    if(tieneRasgo(p,'Líder'))lid++;
    const cal=v*(.72+.28*p.con/100)*(.94+.12*p.mor/100);
    if(slots[i][0]==="POR"){gk=cal;return}
    let z=ZONA[slots[i][0]];
    const rol=p.trole;
    if(rol&&rol!=='normal'){
      z=Object.assign({},z);
      if(rol==='lateral_of'){z.a*=1.35;z.d*=.92}
      else if(rol==='central_cierre'){z.d*=1.18;z.m*=.9}
      else if(rol==='pivote'){z.d*=1.22;z.a*=.85}
      else if(rol==='box'){z.a*=1.22;z.d*=.88}
      else if(rol==='organizador'){z.m*=1.20}

      else if(rol==='falso9'){z.m*=1.25;z.a*=.85}
      else if(rol==='presion'){z.d*=1.12;z.m*=1.06}
    }
    d+=cal*z.d;dw+=z.d;m+=cal*z.m;mw+=z.m;a+=cal*z.a;aw+=z.a;
  });
  d=dw?d/dw:45;m=mw?m/mw:45;a=aw?a/aw:45;
  const t=c.tac,f=1+cl(lid,0,3)*.006;
  d*=f;m*=f;a*=f;
  if(t.ment==="of"){a*=1.09;m*=1.02;d*=.91}
  if(t.ment==="tot"){a*=1.17;m*=1.03;d*=.80}
  if(t.ment==="def"){a*=.88;d*=1.11}
  if(t.estilo==="pos"){m*=1.09;a*=.99}
  if(t.estilo==="cont"){m*=.89;a*=1.09;d*=1.04}
  if(t.estilo==="dir"){m*=.95;a*=1.05}
  if(t.estilo==="band"){m*=1.02;a*=1.04;d*=.98}
  if(t.pres==="alta"){m*=1.06;d*=.95}
  if(t.pres==="gegen"){m*=1.11;d*=.90}
  if(t.pres==="baja"){m*=.95;d*=1.08}
  if(t.foco==="bandas"){a*=1.035;m*=1.015}
  if(t.foco==="centro"){m*=1.025}
  if(t.foco==="espalda"){a*=1.055;d*=.985}
  if(t.ritmo==="alto"){a*=1.055;m*=1.02;d*=.97}
  if(t.ritmo==="bajo"){d*=1.045;m*=1.025;a*=.965}
  if(t.linea==="alta"){m*=1.035;d*=.965;a*=1.02}
  if(t.linea==="baja"){d*=1.06;m*=.98;a*=.96}
  if(local){d*=1.04;m*=1.04;a*=1.05}
  return {d,m,a,gk,c};
}
function elige(c,tabla,fuera){
  const slots=FORM[c.tac.form],cand=[];let tot=0;
  c.once.forEach((id,i)=>{const p=G.j[id];if(!p||slots[i][0]==="POR")return;
    if(fuera&&fuera.has(id))return;
    let w=tabla[slots[i][0]]*Math.pow((tabla===PGOL?p.at.ata:p.at.pas)/62,1.30);
    if(tabla===PGOL&&tieneRasgo(p,'Finalizador'))w*=1.45;
    if(tabla===PGOL&&tieneRasgo(p,'Cañón'))w*=1.15;
    if(tabla===PASI&&tieneRasgo(p,'Cerebro'))w*=1.6;
    cand.push([p,w]);tot+=w});
  if(!tot)return null;
  let r=Math.random()*tot;
  for(const [p,w] of cand){r-=w;if(r<=0)return p}
  return cand[0][0];
}

function simTramo(A,B,ini,fin,ctx){
  const ev=[];
  const cfgBase=[[A,B,'l'],[B,A,'v']];
  for(let min=ini;min<=fin;min++){
    const penal={l:1-.115*ctx.exp.l, v:1-.115*ctx.exp.v};
    const mA=A.m*penal.l, mB=B.m*penal.v;
    const ctrl=mA/(mA+mB);
    cfgBase.forEach(([X,Y,lado])=>{
      const ct=lado==='l'?ctrl:1-ctrl;
      const px=lado==='l'?penal.l:penal.v, py=lado==='l'?penal.v:penal.l;
      const xa=X.a*px, yd=Y.d*py, ygk=Y.gk*(py>.9?1:.97);
      const rate=.124*Math.pow(ct/.5,.95)*Math.pow(xa/yd,.45);
      if(Math.random()<rate){
        const conv=cl(.112*Math.pow(xa/(.55*yd+.45*ygk),1.6),.02,.5);
        const p=elige(X.c,PGOL,ctx.fuera);
        const base={m:min,lado,tiro:1,xg:conv,jid:p?p.id:null};
        if(Math.random()<conv){
          let asi=null;
          if(Math.random()<.68){for(let t=0;t<6;t++){const q=elige(X.c,PASI,ctx.fuera);if(q&&(!p||q.id!==p.id)){asi=q;break}}}
          const txtGol=p?pick(RELATO_GOL)(p.nom):RELATO_PROPIA;
          const gkGol=porteroDe(Y.c);
          ev.push(Object.assign({},base,{t:'gol',puerta:1,aid:asi?asi.id:null,gid:gkGol?gkGol.id:Y.c.once[0],
            txt:txtGol+' ('+X.c.abr+')'+(asi?pick(RELATO_ASIST)(corto(asi.nom)):'')}));
        }else{
          const r=Math.random();
          const nom=p?corto(p.nom):'el rival';
          const gkY=porteroDe(Y.c);
          const txtPar=(gkY&&gkY.pos==='POR')
            ? pick(RELATO_ATAJADA)(corto(gkY.nom))
            : '🧤 '+(gkY?corto(gkY.nom):'Un defensor')+' saca la pelota bajo los tres palos como puede ante '+nom;
          if(r<.42)ev.push(Object.assign({},base,{t:'oc',puerta:1,gid:gkY?gkY.id:Y.c.once[0],txt:txtPar+' ('+X.c.abr+')'}));
          else if(r<.58)ev.push(Object.assign({},base,{t:'oc',puerta:0,txt:pick(RELATO_PALO)(nom)+' ('+X.c.abr+')'}));
          else if(r<.8)ev.push(Object.assign({},base,{t:'oc',puerta:0,txt:pick(RELATO_DESVIADO)(nom)+' ('+X.c.abr+')'}));
          else ev.push(Object.assign({},base,{t:'fall',puerta:0,txt:pick(RELATO_FALLADA)(nom)+' ('+X.c.abr+')'}));
        }
      }
      if(Math.random()<.024){
        const en=X.c.once.map(i=>G.j[i]).filter(p=>p&&!(ctx.fuera&&ctx.fuera.has(p.id)));
        const p=pick(en);
        if(p){
          const prov=tieneRasgo(p,'Provocador');
          if(Math.random()<(prov?.10:.045)){
            ctx.exp[lado]++;if(ctx.fuera)ctx.fuera.add(p.id);
            ev.push({m:min,lado,t:'roja',jid:p.id,txt:pick(RELATO_ROJA)(p.nom)+'. '+X.c.abr+' se queda con '+(11-ctx.exp[lado])});
          }else ev.push({m:min,lado,t:'am',jid:p.id,txt:pick(RELATO_AMARILLA)(corto(p.nom))+' ('+X.c.abr+')'});

        const p=pick(en);

      }
    });
  }
  return ev;
}

  const dm=(c,r)=>c.plantilla.forEach(id=>{const p=G.j[id];if(p)p.mor=cl(p.mor+r,10,100)});
  if(M.l>M.v){dm(a,6);dm(b,-6)}else if(M.l<M.v){dm(b,6);dm(a,-6)}else{dm(a,1);dm(b,1)}
  const lleno=cl(.58+a.pts/80+(a.liga<5?.14:0),.5,1);
  a.caja+=Math.round(a.aforo*lleno*(a.liga<5?34:22)+a.rep*a.rep*(a.liga<5?44:28));
  b.caja+=Math.round(b.rep*b.rep*(b.liga<5?24:12));
  if(comp==='copa'){a.caja+=800000;b.caja+=600000}
  if(comp==='ucl'){a.caja+=3200000;b.caja+=2600000;a.coef+=M.l>M.v?2:M.l===M.v?1:0;b.coef+=M.v>M.l?2:M.l===M.v?1:0}
  if(comp==='uel'){a.caja+=1800000;b.caja+=1400000;a.coef+=M.l>M.v?1:0;b.coef+=M.v>M.l?1:0}
  return st;
}
function hayPenales(comp){
  if(comp==='liga'||!comp)return false;
  if(comp==='ucl'||comp==='uel'){
    const T=torneo(comp);
    if(!T||T.fase==='liga')return false;
  }
  if(comp==='lib'||comp==='sud'){
    const T=torneo(comp);
    if(!T||T.fase==='grupos')return false;  /* en grupos el empate reparte puntos */
  }
  return true;
}

function avanzar(){
  if(G.fin)return render();
  if(G.tanda&&!G.tanda.fin)return render();
  const ev=G.eventos[G.sem];
  if(!ev){if(G.resumen){ui.modal=G.resumen;return render()}return finTemporada()}
  if(ev.t==='mercado'){
    G.mercado=true;G.mktCierra=G.sem+6;G.sem++;mercadoIA();
    news('Se abre el mercado de invierno','Queda abierto unas 6 jornadas (cerca de mes y medio). Se cierra solo: no hace falta que lo cierres vos.','info');
    ui.tab='fichajes';guardar();return render()}
  if(ev.t==='liga')return rondaLiga(ev.r);
  if(ev.t==='super')return rondaKO('super',ev.r);
  if(ev.t==='copa')return rondaKO('copa',ev.r);
  if(ev.t==='eu')return rondaEuropa(ev.r);
  if(ev.t==='po')return rondaPO(ev.r);
}
function rondaLiga(r){
  const mi=G.clubes[G.yo].liga;
  for(let l=0;l<LIGAS.length;l++){
    if(l===mi)continue;
    (G.liga[l][r]||[]).forEach(p=>simularIA(G.clubes[p[0]],G.clubes[p[1]],'liga'));
  }
  const par=G.liga[mi][r]||[];
  const mio=par.find(p=>p[0]===G.yo||p[1]===G.yo);
  if(!mio){par.forEach(p=>simularIA(G.clubes[p[0]],G.clubes[p[1]],'liga'));
    news('Jornada libre','Tu equipo no juega esta fecha.','info');G.sem++;procesarSemana();return render()}
  prepararPartido(G.clubes[mio[0]],G.clubes[mio[1]],'liga',par.filter(p=>p!==mio),r);
}
function torneo(k){return k==='copa'?G.copa:k==='ucl'?G.ucl:k==='uel'?G.uel:k==='lib'?G.lib:k==='sud'?G.sud:k==='super'?G.super:G.po}
function fasesDe(k){
  if(k==='super')return (G.super&&G.super.fases)||["FINAL"];
  if(k==='copa')return (G.copa&&G.copa.tope===32)?FASES_COPA32:FASES4;
  if(k==='po')return ["Semifinal","FINAL"];
  if(k==='ucl'||k==='uel')return FASES_EU;
  if(k==='lib'||k==='sud')return ["Fase de grupos","Octavos de final","Cuartos de final","Semifinal","FINAL"];
  return FASES5;
}
function rondaKO(k,r){
  const T=torneo(k);
  if(!T||!T.llaves.length){G.sem++;procesarSemana();return render()}
  const mio=T.llaves.find(p=>p[0]===G.yo||p[1]===G.yo);
  const otros=T.llaves.filter(p=>p!==mio);
  if(!mio){
    resolverKO(k,T.llaves.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],k)})));
    G.sem++;procesarSemana();ui.tab='comps';ui.sub=k;return render();
  }
  prepararPartido(G.clubes[mio[0]],G.clubes[mio[1]],k,otros,r);
}
function euAplicarLiga(T,par,st,k){
  if(T&&T.tabla){const pj=Math.max(...Object.values(T.tabla).map(x=>x.pj||0));T.jornada=Math.min(T.jornadas,pj+1)}
  const [a,b]=par, ta=T.tabla[a], tb=T.tabla[b];
  if(!ta||!tb)return;
  ta.pj++;tb.pj++;ta.gf+=st.l;ta.gc+=st.v;tb.gf+=st.v;tb.gc+=st.l;
  if(st.l>st.v){ta.pts+=3;ta.pg++;tb.pp++}
  else if(st.v>st.l){tb.pts+=3;tb.pg++;ta.pp++}
  else{ta.pts++;tb.pts++;ta.pe++;tb.pe++}
}
function rondaEuropa(r){
  /* r numérico = jornada de fase de liga; r string = eliminatoria */
  const esLiga=typeof r==='number';
  let miTorneo=null,miPar=null,otros=[],vivoLeg=null;
  ['ucl','uel','lib','sud'].forEach(k=>{
    const T=torneo(k);if(!T)return;
    if(esLiga){
      if(r>=T.jornadas)return;
      const par=T.rondas[r]||[];
      const mio=par.find(p=>p.includes(G.yo));
      if(mio&&!miTorneo){miTorneo=k;miPar=mio;otros=par.filter(p=>p!==mio)}
      else par.forEach(p=>{const st=simularIA(G.clubes[p[0]],G.clubes[p[1]],k);euAplicarLiga(T,p,st,k)});
    }else{
      if(T.conmebol){
        if(T.fase==='grupos'&&r==='rep'){cerrarGrupos(T);return}
        const leg=LEG[r];
        if(!leg)return;
        if(leg==='vuelta'&&T.llaves.length){
          /* la vuelta se juega con la localía invertida */
          T.llavesVuelta=T.llaves.map(p=>[p[1],p[0]]);
        }
        const lista=leg==='vuelta'?(T.llavesVuelta||T.llaves.map(p=>[p[1],p[0]])):T.llaves;
        if(!lista.length)return;
        const mio=lista.find(p=>p.includes(G.yo));
        if(mio&&!miTorneo){miTorneo=k;miPar=mio;otros=lista.filter(p=>p!==mio);vivoLeg=leg}
        else{
          const res=lista.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],k)}));
          resolverConmebol(k,r,res);
        }
        return;
      }
      if(!T.conmebol&&T.fase==='liga'&&r==='rep')cerrarFaseLiga(T);
      if(r==='8'&&T.fase==='repechaje')return;      // se arma tras el repechaje
      if(!T.llaves.length)return;
      const mio=T.llaves.find(p=>p.includes(G.yo));
      if(mio&&!miTorneo){miTorneo=k;miPar=mio;otros=T.llaves.filter(p=>p!==mio)}
      else resolverKO(k,T.llaves.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],k)})));
    }
  });
  if(!miTorneo){G.sem++;procesarSemana();ui.tab='comps';ui.sub=esSA(G.clubes[G.yo].liga)?'lib':'ucl';return render()}
  const T=torneo(miTorneo);
  prepararPartido(G.clubes[miPar[0]],G.clubes[miPar[1]],miTorneo,otros,r);
  if(vivo){vivo.euLiga=esLiga;vivo.leg=vivoLeg;}
}
function ganadorDe(p,st){return st.l>st.v?p[0]:st.v>st.l?p[1]:(st.pen[0]>st.pen[1]?p[0]:p[1])}
function euAvanzar(T,k,gan){
  /* pasa de repechaje -> octavos -> cuartos -> semi -> final */
  const nom=T.nombre;
  if(T.fase==='repechaje'){
    const clasificados=(T.directos||[]).concat(gan);
    T.fase='octavos';T.ronda=1;
    const mezcla=clasificados.slice().sort(()=>Math.random()-.5);
    const ll=[];for(let i=0;i<mezcla.length-1;i+=2)ll.push([mezcla[i],mezcla[i+1]]);
    T.llaves=ll;
    if(clasificados.includes(G.yo))news(nom+': a octavos','Superás el repechaje y entrás en el cuadro final.','bien');
    return true;
  }
  const orden=['octavos','cuartos','semi','final'];
  const idx=orden.indexOf(T.fase);
  if(idx<0)return false;
  if(idx>=3){T.campeon=gan[0];T.llaves=[];return false}
  T.fase=orden[idx+1];T.ronda=idx+2;
  const ll=[];for(let i=0;i<gan.length-1;i+=2)ll.push([gan[i],gan[i+1]]);
  T.llaves=ll;
  return true;
}
function resolverConmebol(k,r,res){
  const T=torneo(k),leg=LEG[r];
  if(T.fase==='playoff'){
    /* el playoff de la Sudamericana también es ida y vuelta */
    const gan=conmebolLeg(T,k,'playoff',leg,res);
    if(!gan)return;
    const clas=(T.clasificadosDirecto||[]).concat(gan);
    T.fase='octavos';T.ronda=1;T.clasificadosDirecto=null;
    const mez=clas.slice().sort(()=>Math.random()-.5);
    const ll=[];for(let i=0;i<mez.length-1;i+=2)ll.push([mez[i],mez[i+1]]);
    T.llaves=ll;T.llavesVuelta=null;
    if(gan.includes(G.yo))news(T.nombre+': a octavos','Superaste el playoff.','bien');
    return;
  }
  if(leg==='unico'){
    /* la final es a partido único en cancha neutral */
    const gan=res.map(x=>ganadorDe(x.p,x.st));
    T.hist.push({ronda:T.ronda,leg:'final',par:res.map(x=>({p:x.p,l:x.st.l,v:x.st.v,pen:x.st.pen||null}))});
    T.campeon=gan[0];T.llaves=[];
    premiarCampeon(k,T);
    return;
  }
  const gan=conmebolLeg(T,k,T.fase,leg,res);
  if(!gan)return;
  const orden=['octavos','cuartos','semi','final'];
  const i=orden.indexOf(T.fase);
  const eraMio=res.some(x=>x.p.includes(G.yo)), sigo=gan.includes(G.yo);
  if(i<0||i>=3){T.campeon=gan[0];T.llaves=[];premiarCampeon(k,T);return}
  T.fase=orden[i+1];T.ronda=i+2;
  const ll=[];for(let j=0;j<gan.length-1;j+=2)ll.push([gan[j],gan[j+1]]);
  T.llaves=ll;T.llavesVuelta=null;
  if(eraMio&&!sigo){news('Eliminados de la '+T.nombre,'Quedás afuera en el global.','mal');G.conf=cl(G.conf-4,0,100)}
  else if(sigo)news('A la siguiente ronda','Seguís vivo en la '+T.nombre+'.','bien');
}
function premiarCampeon(k,T){
  const c=G.clubes[T.campeon];
  c.coef+=k==='lib'?5:2;
  if(T.campeon===G.yo){
    const premio=k==='lib'?24000000:9000000;
    G.clubes[G.yo].caja+=premio;G.conf=cl(G.conf+(k==='lib'?30:18),0,100);
    G.repDT+=k==='lib'?12:7;
    G.palmares.push({temp:G.temp,anio:G.anio,t:T.nombre,tipo:k});
    news('🏆 ¡CAMPEONES DE LA '+T.nombre.toUpperCase()+'!','Gloria continental. '+eur(premio)+' en premios.','bien');
  }else news('Final de la '+T.nombre,c.n+' se corona campeón de América.','info');
}
function resolverKO(k,res){
  const T=torneo(k),fases=fasesDe(k),nom=T.nombre||'Copa';
  if((k==='ucl'||k==='uel')&&T.fase&&T.fase!=='liga'){
    const gan=res.map(x=>ganadorDe(x.p,x.st));
    T.hist.push({ronda:T.ronda,par:res.map(x=>({p:x.p,l:x.st.l,v:x.st.v,pen:x.st.pen||null}))});
    const eraMio=res.some(x=>x.p.includes(G.yo)), sigo=gan.includes(G.yo);
    const eraFinal=T.fase==='final';
    euAvanzar(T,k,gan);
    if(eraFinal){
      const c=G.clubes[T.campeon];c.coef+=k==='ucl'?6:3;
      if(T.campeon===G.yo){
        const premio=k==='ucl'?55000000:18000000;
        G.clubes[G.yo].caja+=premio;G.conf=cl(G.conf+(k==='ucl'?32:20),0,100);
        G.repDT+=k==='ucl'?14:8;
        G.palmares.push({temp:G.temp,anio:G.anio,t:nom,tipo:k});
        news('🏆 ¡CAMPEONES DE LA '+nom.toUpperCase()+'!','Noche histórica. '+eur(premio)+' en premios.','bien');
      }else news('Final de la '+nom,c.n+' levanta el trofeo.','info');
    }else if(eraMio&&!sigo){news('Eliminados de la '+nom,'Se termina el camino europeo.','mal');G.conf=cl(G.conf-4,0,100)}
    else if(sigo)news('A la siguiente ronda','Seguís vivo en la '+nom+'.','bien');
    return;
  }
  const gan=res.map(x=>ganadorDe(x.p,x.st));
  T.hist.push({ronda:T.ronda,par:res.map(x=>({p:x.p,l:x.st.l,v:x.st.v,pen:x.st.pen||null}))});
  const eraMio=res.some(x=>x.p.includes(G.yo)), sigo=gan.includes(G.yo);
  if(T.ronda>=fases.length-1){
    T.campeon=gan[0];T.llaves=[];
    const c=G.clubes[gan[0]];
    c.coef+=k==='ucl'?6:k==='uel'?3:0;
    if(gan[0]===G.yo){
      const premio=k==='ucl'?55000000:k==='uel'?18000000:k==='copa'?11000000:k==='super'?4000000:0;
      G.clubes[G.yo].caja+=premio;G.conf=cl(G.conf+(k==='ucl'?32:20),0,100);
      G.repDT+=k==='ucl'?14:k==='uel'?8:5;
      G.palmares.push({temp:G.temp,anio:G.anio,t:nom,tipo:k});
      news('🏆 ¡CAMPEONES DE LA '+nom.toUpperCase()+'!','Noche histórica. '+eur(premio)+' en premios y el nombre del club en la vitrina para siempre.','bien');
    }else news('Final de la '+nom,c.n+' se queda con el título.','info');
  }else{
    T.ronda++;
    const ll=[];for(let i=0;i<gan.length;i+=2)ll.push([gan[i],gan[i+1]]);
    if(k!=='po')ll.sort(()=>Math.random()-.5);
    T.llaves=ll;
    if(eraMio&&!sigo){news('Eliminados de la '+nom,'Adiós al torneo en '+fases[T.ronda-1]+'.','mal');G.conf=cl(G.conf-4,0,100)}
    else if(sigo)news('A la siguiente ronda','Seguís vivo en la '+nom+': ahora toca '+fases[T.ronda]+'.','bien');
  }
}

function prepararPartido(a,b,comp,otros,r){
  const yo=G.clubes[G.yo];
  if(!onceOk(yo)){autoOnce(yo);news('Once corregido','Se completó la alineación con jugadores disponibles.','info')}
  [a,b].forEach(c=>{if(c.id!==G.yo)autoOnce(c)});
  if(!esArqueroReal(yo))news('¡No tenés arquero!','Hay un jugador de campo ocupando el arco. Revisá la pizarra antes de jugar: te va a costar muy caro.','mal');
  const cans=yo.once.filter(id=>G.j[id]&&G.j[id].con<45).length;
  if(cans>=3)news('Piernas pesadas',cans+' titulares por debajo del 45% de forma. Conviene rotar.','mal');
  vivo={a:a.id,b:b.id,comp,otros,r,min:0,fase:'previa',eventos:[],cambios:0,vel:200,timer:null,pintados:0,salieron:[],ctx:ctxNuevo()};
  G.charla=null;ui.tab='partido';render();
}
function vistos(){return vivo?vivo.eventos.filter(e=>e.m<=vivo.min):[]}
function finMitad(){return vivo.fase==='2t'?90:45}
function simularResto(desde){
  const a=G.clubes[vivo.a],b=G.clubes[vivo.b];
  const previos=vivo.eventos.filter(e=>e.m<=desde);
  vivo.ctx=ctxDesde(previos);

}
function charlaVestuario(op){

function reanudar(){if(vivo&&!vivo.corre&&(vivo.fase==='1t'||vivo.fase==='2t')){vivo.timer=setInterval(tick,vivo.vel);vivo.corre=true;render()}}
function cerrarPartido(){
  const a=G.clubes[vivo.a],b=G.clubes[vivo.b];
  const st=cerrar(vivo.eventos,a,b,vivo.comp,vivo.salieron,vivo.leg);

  if(st.pen&&!vivo.penHechos){
    vivo.penHechos=true;
    delete st.pen;
    return penIniciar(a,b,res=>{
      st.pen=res.pen;
      vivo.eventos.push({m:90,t:'pen',txt:'🎯 Penales: '+res.pen[0]+'-'+res.pen[1]});

    });
  }
  cerrarPartidoResto(a,b,st);
}
function cerrarPartidoResto(a,b,st){
  if(st.pen&&!vivo.eventos.some(e=>e.t==='pen'))vivo.eventos.push({m:90,t:'pen',txt:'🎯 Tanda de penales: '+st.pen[0]+'-'+st.pen[1]});
  vivo.otrosRes=(vivo.liveOthers&&vivo.liveOthers.length)?vivo.liveOthers.map(x=>({p:x.p,st:cerrar(x.evs,G.clubes[x.p[0]],G.clubes[x.p[1]],vivo.comp)})):vivo.otros.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],vivo.comp)}));
  if(vivo.comp==='po')return;
  if(vivo.comp!=='liga'){
    const T=torneo(vivo.comp);
    if(['ucl','uel','lib','sud'].includes(vivo.comp)&&vivo.euLiga){
      euAplicarLiga(T,[a.id,b.id],st,vivo.comp);
      (vivo.otrosRes||[]).forEach(x=>euAplicarLiga(T,x.p,x.st,vivo.comp));
    }else if(T&&T.conmebol){
      /* llaves de ida y vuelta: hay que respetar el orden y la localía de la llave */
      const lista=vivo.leg==='vuelta'?(T.llavesVuelta||T.llaves.map(p=>[p[1],p[0]])):T.llaves;
      const todos=[{p:[a.id,b.id],st},...(vivo.otrosRes||[])];
      const ord=lista.map(par=>todos.find(x=>x.p[0]===par[0]&&x.p[1]===par[1])).filter(Boolean);
      resolverConmebol(vivo.comp,vivo.r,ord);
    }else{
      const todos=[{p:[a.id,b.id],st},...vivo.otrosRes];
      const ord=T.llaves.map(par=>todos.find(x=>x.p[0]===par[0]&&x.p[1]===par[1]));
      resolverKO(vivo.comp,ord.filter(Boolean));
    }
  }
  const soyL=a.id===G.yo, mg=soyL?st.l:st.v, rg=soyL?st.v:st.l, yo=G.clubes[G.yo];
  if(vivo.comp==='liga'){
    const t=tablaLiga(yo.liga),pos=t.findIndex(x=>x.id===G.yo)+1;
    const dif=cl(G.obj.pos-pos,-3,3);
    G.conf=cl(G.conf+(yo.pj>=5?dif*.5:0)+(mg>rg?2:mg===rg?.4:-1),0,100);
  }else G.conf=cl(G.conf+(mg>rg?2.5:-1),0,100);
  G.sem++;
  {const yo2=G.clubes[G.yo],riv=G.clubes[a.id===G.yo?b.id:a.id];
   if(mg>rg&&ovOnce(riv)-ovOnce(yo2)>=12)darLogro('david');}
  darLogro('debut');
  procesarSemana();
}
function procesarSemana(){
  const yo=G.clubes[G.yo];
  if(G.mercado&&G.mktCierra!=null&&G.sem>=G.mktCierra){
    G.mercado=false;G.mktCierra=null;

  }

    if(p.san>0)p.san--;
    if(p.con<100)p.con=cl(p.con+(p.les?6:15+Math.round(p.at.fis/10)),0,100);
  });
  const e=yo.tac.entr;
  yo.plantilla.forEach(id=>{const p=G.j[id];if(!p||p.les)return;
    if(e==='intenso'){p.con=cl(p.con-7,20,100);if(Math.random()<.11&&p.ov<p.pot)mejorar(p);if(Math.random()<.012)p.les=ri(1,3)}
    else if(e==='suave'){p.con=cl(p.con+10,0,100);p.mor=cl(p.mor+2,0,100)}
    else if(e==='tec'){if(Math.random()<.09&&p.ov<p.pot)mejorar(p,['pas','reg','ata'])}
    else if(e==='fis'){if(Math.random()<.09&&p.ov<p.pot)mejorar(p,['fis','vel','def'])}

    if(tieneRasgo(p,'Líder'))p.mor=cl(p.mor+1,0,100);
  });
  G.clubes.forEach(c=>{
    const sal=c.plantilla.reduce((s,id)=>s+(G.j[id]?G.j[id].sal:0),0);
    c.presu+=c.caja-sal;c.caja=0;
  });
  if(yo.presu<-3000000&&!G.deuda){G.deuda=true;
    news('La junta te llama al orden','El club está en números rojos. Hay que vender o recortar salarios.','mal');G.conf=cl(G.conf-6,0,100)}
  if(yo.presu>=0)G.deuda=false;
  const titulares=new Set(yo.once);yo.plantilla.forEach(id=>{const p=G.j[id];if(!p)return;
    if(p.promesa){p.promesa.rest--;if(titulares.has(id)){p.promesa=null;p.mor=cl(p.mor+4,0,100)}else if(p.promesa.rest<=0){p.promesa=null;p.queja++;p.mor=cl(p.mor-16,0,100);news('Promesa incumplida',p.nom+' esperaba ser titular y está muy molesto.','mal')}}
    if(p.rol==='titular'&&!titulares.has(id)&&Math.random()<.16){p.queja++;p.mor=cl(p.mor-4,0,100);if(p.queja===2)news('Quiere más minutos',p.nom+' no acepta seguir fuera del once.','mal')}
    if(p.mor<30&&p.amb>70&&Math.random()<.12){p.lista=true;news('Pide salir',p.nom+' solicita ser transferido por falta de protagonismo.','mal')}
  });
  ofertasIA();
  if(G.mercado)mercadoIA(ri(3,7));      // ventana abierta: el mundo se mueve cada jornada
  else if(G.sem%5===0)mercadoIA(2);

    news('Voto de confianza… a medias','La junta está preocupada. Si esto no cambia, buscarán otro entrenador.','mal')}

  if(G.sem>=G.eventos.length)return finTemporada();

}
function mejorar(p,keys){
  const k=pick(keys&&keys.length?keys:Object.keys(PESOS[p.pos]));
  p.at[k]=cl(p.at[k]+ri(1,2),0,99);
  const n=ovDe(p);
  if(n>p.ov){p.ov=n;p.val=valorDe(p);p.sal=salarioDe(p);

}

function generarOfertasTrabajo(){

    .sort((a,b)=>Math.abs(a.rep-techo)-Math.abs(b.rep-techo)).slice(0,14).sort(()=>Math.random()-.5).slice(0,4);
  return cand.map(c=>({club:c.id}));

function pedido(p,c){
  let f=1.15+hash01(p.id)*.35;
  if(p.edad<=23)f+=.18;
  if(c&&c.plantilla.length<=17)f+=.25;
  if(p.lista)f-=.2;
  if(c&&c.once.includes(p.id))f+=.15;
  return Math.round(p.val*Math.max(.6,f)/10000)*10000;
}
function salarioPedido(p,dest){
  const or=G.clubes.find(c=>c.plantilla.includes(p.id));
  let f=1.12;
  if(or&&dest.rep<or.rep-4)f+=.2;
  if(or&&dest.liga===5&&or.liga<5)f+=.25;
  return Math.round(p.sal*f/100)*100;
}
function registrarTraspaso(p,de,a,precio){
  G.traspasos.unshift({t:G.temp,sem:G.sem,j:p.nom,pos:p.pos,ov:p.ov,de:de?de.id:null,a:a?a.id:null,precio});
  if(G.traspasos.length>240)G.traspasos.pop();
}
function ofertar(id,pctFee,pctSal,primaSem,rol){
  const p=G.j[id],yo=G.clubes[G.yo];
  const dueno=G.clubes.find(c=>c.plantilla.includes(id));
  const base=dueno?pedido(p,dueno):0;
  const fee=Math.round(base*pctFee), sal=Math.round(salarioPedido(p,yo)*pctSal),prima=Math.round(sal*(primaSem||0));
  if(!G.mercado)return aviso('Mercado cerrado','Solo se puede fichar en pretemporada y en la ventana de enero.');
  if(yo.plantilla.length>=30)return aviso('Plantilla completa','El límite son 30 jugadores.');
  if(fee+prima>yo.presu)return aviso('Fondos insuficientes','La operación cuesta '+eur(fee+prima)+' y tenés '+eur(yo.presu)+'.');
  if(dueno&&dueno.plantilla.length<=16)return aviso('Operación rechazada',dueno.n+' no puede quedarse con menos de 17 jugadores.');
  if(dueno){
    let pa=cl(.06+(pctFee-.85)*2.6,.02,.97);
    if(p.lista)pa+=.3;
    if(dueno.once.includes(p.id))pa-=.18;
    if(dueno.presu<0)pa+=.15;
    if(Math.random()>cl(pa,.02,.97))
      return aviso('Oferta rechazada',dueno.n+' considera insuficientes '+eur(fee)+' por '+p.nom+'. Piden '+eur(base)+'.');
  }
  let pj=cl(.25+(pctSal-1)*1.9+(yo.rep-(dueno?dueno.rep:60))/45,.05,.97);if(primaSem)pj+=.14;if(rol==='titular')pj+=.12;
  if(p.ov>ovOnce(yo)+7)pj-=.22;
  if(Math.random()>cl(pj,.05,.97))
    return aviso('El jugador dice que no',p.nom+' no ve claro el proyecto con esa ficha. Pedía '+eur(salarioPedido(p,yo))+' por semana.');
  yo.presu-=fee+prima;
  if(dueno){dueno.plantilla=dueno.plantilla.filter(x=>x!==id);dueno.presu+=fee;autoOnce(dueno)}
  else G.libres=G.libres.filter(x=>x!==id);
  yo.plantilla.push(id);p.lista=false;p.mor=cl(p.mor+10,0,100);p.ctr=ri(2,5);p.sal=sal;p.dor=dorsalLibre(yo);p.rol=rol||'rotacion';p.promesa=rol==='titular'?{txt:'ser titular importante',rest:16}:null;
  registrarTraspaso(p,dueno,yo,fee);
  news('Fichaje cerrado','Llega '+p.nom+' ('+p.pos+', '+p.ov+') por '+eur(fee)+' y '+eur(sal)+'/semana.','bien');
  ui.modal=null;guardar();render();
}
function dorsalLibre(c){
  const u=new Set(c.plantilla.map(id=>G.j[id]&&G.j[id].dor));
  for(let i=1;i<60;i++)if(!u.has(i))return i;
  return 99;
}
function vender(id,precio,compId){
  const yo=G.clubes[G.yo],p=G.j[id];
  if(yo.plantilla.length<=16)return aviso('Plantilla corta','No podés bajar de 16 jugadores.');
  yo.plantilla=yo.plantilla.filter(x=>x!==id);yo.presu+=precio;
  const comp=compId!=null?G.clubes[compId]:null;
  if(comp){comp.plantilla.push(id);p.dor=dorsalLibre(comp);autoOnce(comp)}else G.libres.push(id);
  yo.once=yo.once.map(x=>x===id?null:x);
  if(yo.once.some(x=>!x))autoOnce(yo);
  G.ofertas=(G.ofertas||[]).filter(o=>o.id!==id);
  registrarTraspaso(p,yo,comp,precio);
  news('Venta cerrada',p.nom+' se marcha por '+eur(precio)+'.','info');
  ui.modal=null;guardar();render();
}
function ofertasIA(){
  G.ofertas=(G.ofertas||[]).filter(o=>o.exp>G.sem);
  const yo=G.clubes[G.yo];
  if(yo.plantilla.length<=17||!G.mercado)return;
  yo.plantilla.forEach(id=>{
    const p=G.j[id];if(!p)return;
    if(Math.random()<(p.lista?.5:.05)&&G.ofertas.length<6){
      const comp=pick(G.clubes.filter(c=>c.id!==G.yo&&c.presu>p.val*1.15&&c.plantilla.length<28));
      if(!comp)return;
      const precio=Math.round(p.val*(p.lista?rf(.85,1.15):rf(1.1,1.6))/10000)*10000;
      G.ofertas.push({id,club:comp.id,precio,exp:G.sem+4});
      news('Oferta por '+p.nom,comp.n+' pone '+eur(precio)+' sobre la mesa.','info');
    }
  });
}
function mercadoIA(cant){
  let ops=0,lim=cant||16;
  for(let i=0;i<lim*7&&ops<lim;i++){
    const comp=pick(G.clubes.filter(c=>c.id!==G.yo&&c.plantilla.length<28&&c.presu>4000000));
    if(!comp)break;
    const vend=pick(G.clubes.filter(c=>c.id!==G.yo&&c.id!==comp.id&&c.plantilla.length>18));
    if(!vend)break;
    const cands=vend.plantilla.map(id=>G.j[id]).filter(p=>p&&!vend.once.includes(p.id)&&p.val<comp.presu*.45);
    if(!cands.length)continue;
    const p=cands.sort((a,b)=>b.ov-a.ov)[0];
    const pr=pedido(p,vend);
    if(pr>comp.presu)continue;
    comp.presu-=pr;vend.presu+=pr;
    vend.plantilla=vend.plantilla.filter(x=>x!==p.id);comp.plantilla.push(p.id);
    p.dor=dorsalLibre(comp);autoOnce(vend);autoOnce(comp);
    registrarTraspaso(p,vend,comp,pr);ops++;
  }
  return ops;
}

function tablaLiga(l){
  return G.clubes.filter(c=>c.liga===l)
    .sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.n.localeCompare(b.n));

function simPOCompleto(){

function resolverPO(res){

function cerrarSeason(){
  const yo=G.clubes[G.yo],lg=yo.liga,t=tablaLiga(lg),pos=t.findIndex(c=>c.id===G.yo)+1,n=t.length;
  const premio=lg===5?Math.round((21-pos)*600000+4000000)

  yo.presu+=premio;
  let asc=false,desc=false;
  if(lg===5)asc=pos<=2||(G.po&&G.po.campeon===G.yo);
  if(lg<5)desc=pos>n-3;
  let cumplido=pos<=G.obj.pos||asc;
  G.conf=cl(G.conf+(cumplido?22:-26)+(asc?30:0)+(desc?-30:0),0,100);
  if(pos===1){G.palmares.push({temp:G.temp,anio:G.anio,t:LIGAS[lg][0],tipo:'liga'});G.repDT+=lg===5?6:14}
  if(asc){G.palmares.push({temp:G.temp,anio:G.anio,t:'Ascenso a la Premier League',tipo:'asc'});G.repDT+=9}
  if(desc)G.repDT=cl(G.repDT-8,10,100);
  if(cumplido)G.repDT=cl(G.repDT+3,10,100);
  G.historial.push({temp:G.temp,anio:G.anio,club:yo.n,liga:lg,pos,pts:yo.pts,
    copa:G.copa&&G.copa.campeon===G.yo,ucl:G.ucl&&G.ucl.campeon===G.yo,uel:G.uel&&G.uel.campeon===G.yo,asc,desc});
  const premios=galardones(lg);
  if(asc)darLogro('ascenso');
  revisarLogros('finTemp');
  G.cerrada=true;
  G.resumen={tipo:'finTemp',pos,premio,cumplido,asc,desc,camp:t[0].id,lg,premios,
    ofertas:(cumplido&&G.repDT>58&&Math.random()<.55)?ofertasDeClubes():null};
  if(!cumplido&&G.conf<=14){G.fin='libre';G.repDT=cl(G.repDT-10,10,100);G.ofertasTrabajo=generarOfertasTrabajo();G.resumen=null;
    news('Fin del ciclo','La junta no te renueva tras una temporada por debajo de lo exigido.','mal')}
  else ui.modal=G.resumen;

function ofertasDeClubes(){
  const yo=G.clubes[G.yo];
  const cand=G.clubes.filter(c=>c.id!==G.yo&&c.rep>yo.rep+3&&c.rep<=30+G.repDT*.78);

function galardones(lg){
  const js=[];
  G.clubes.filter(c=>c.liga===lg).forEach(c=>c.plantilla.forEach(id=>{const p=G.j[id];if(p&&p.pj>4)js.push(p)}));
  const med=p=>p.nt.length?p.nt.reduce((s,x)=>s+x,0)/p.nt.length:0;
  const once=[];
  ["POR","DFC","DFC","LD","LI","MC","MC","MCO","ED","EI","DC"].forEach(pos=>{
    const c=js.filter(p=>p.pos===pos&&!once.includes(p)).sort((a,b)=>med(b)-med(a))[0];
    if(c)once.push(c);
  });
  return {bota:js.slice().sort((a,b)=>b.g-a.g||b.a-a.a)[0],
    asis:js.slice().sort((a,b)=>b.a-a.a)[0],
    mvp:js.slice().filter(p=>p.pj>=15).sort((a,b)=>med(b)-med(a))[0],
    joven:js.slice().filter(p=>p.edad<=21&&p.pj>=10).sort((a,b)=>med(b)-med(a))[0],
    once:once.map(p=>({id:p.id,nota:Math.round(med(p)*10)/10}))};
}

function limpiarBase(){

    .slice(0,90).map(p=>p.id);

let mem=null;
/* el guardado omite campos en su valor por defecto: con 7.000 jugadores eso es la mitad del archivo */
const DEF_J={les:0,san:0,am:0,lista:false,pj:0,g:0,a:0,queja:0,promesa:0,devXP:0,acadXP:0,lastDevPJ:0,
 inAcademy:false,real:false,bonusGol:0,sellOn:0,priceSeen:0,careerPJ:0,careerG:0,trole:'normal',
 devPlan:'equilibrado',rol:'normal',deAcademia:false,avisado20:false};
function compactar(G){
  const c=Object.assign({},G);
  c.j={};
  for(const k in G.j){
    const p=G.j[k],o={};
    for(const f in p){
      if(f in DEF_J&&p[f]===DEF_J[f])continue;
      if(f==='nt'&&(!p[f]||!p[f].length))continue;
      if(f==='rs'&&(!p[f]||!p[f].length))continue;
      o[f]=p[f];
    }
    c.j[k]=o;
  }
  return c;
}
function expandir(G){
  if(!G||!G.j)return G;
  for(const k in G.j){
    const p=G.j[k];
    for(const f in DEF_J)if(!(f in p))p[f]=DEF_J[f];
    if(!p.nt)p.nt=[];
    if(!p.rs)p.rs=[];
  }
  return G;
}
async function guardar(){
  try{const s=JSON.stringify(compactar(G));
    if(window.storage&&window.storage.set)await window.storage.set('touchline26:save',s,false);else mem=s;
  }catch(e){try{mem=JSON.stringify(compactar(G))}catch(e2){}}
}
async function cargar(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get('touchline26:save',false);
    if(r&&r.value)return expandir(JSON.parse(r.value))}}catch(e){}
  return mem?expandir(JSON.parse(mem)):null;
}

  const asc=h.filter(x=>x.asc).length,desc=h.filter(x=>x.desc).length;

  let veredicto;

function consejoPartido(){
  if(!vivo)return '';const a=G.clubes[vivo.a],b=G.clubes[vivo.b],yo=G.clubes[G.yo],loc=a.id===G.yo;
  const M=marcador(vistos()),mi=loc?M.l:M.v,riv=loc?M.v:M.l,mt=loc?M.tl:M.tv,rt=loc?M.tv:M.tl,mx=loc?M.xl:M.xv,rx=loc?M.xv:M.xl;
  const rival=loc?b:a,fr=fuerza(rival,!loc),fy=fuerza(yo,loc);let msg='Partido equilibrado. No regales la estructura.';
  if(vivo.min<20&&fr.m>fy.m+5)msg='El rival domina el medio: sumá presión o atacá más directo.';
  if(vivo.min>=20&&rt>mt+4)msg='Te están rematando demasiado: bajá la línea o el ritmo.';
  if(vivo.min>=25&&mx>rx+.7&&mi<=riv)msg='Generás mejores ocasiones: mantené el plan y evitá precipitarte.';
  if(vivo.min>=55&&mi<riv)msg='Necesitás arriesgar: ritmo alto, línea alta o ataque total.';
  if(vivo.min>=70&&mi>riv)msg='Protegé la ventaja: ritmo bajo y bloque más compacto.';
  if(M.rl||M.rv)msg+=(loc?M.rl:M.rv)?' Estás con uno menos: cerrá espacios.':' El rival tiene uno menos: ensanchá el campo.';

const PEN_ZONAS=['Arriba izq.','Arriba centro','Arriba der.','Abajo izq.','Abajo centro','Abajo der.'];
function penIniciar(a,b,onFin){
  const soyLocal=a.id===G.yo;
  G.tanda={a:a.id,b:b.id,soyLocal,turno:0,mios:[],rivales:[],fase:'patear',
    ultimo:null,fin:false,onFin:!!onFin};

let penTandaFin=null;
function penTirador(c,n){
  const en=c.once.map(id=>G.j[id]).filter(p=>p&&p.pos!=='POR');
  en.sort((x,y)=>(y.at.ata+y.at.reg*.4)-(x.at.ata+x.at.reg*.4));
  return en[n%Math.max(1,en.length)]||G.j[c.once[1]];
}
function penResolver(zonaTiro,zonaAtajada,tirador,arquero){
  /* si el arquero adivina la zona, la ataja según sus reflejos; si no, casi siempre es gol */
  const acierto=zonaTiro===zonaAtajada;
  const calidad=tirador?cl((tirador.at.ata-55)/45,0,1):.5;
  const reflejos=arquero?cl((arquero.at.por-55)/45,0,1):.5;
  let pGol;
  if(acierto)pGol=cl(.34-reflejos*.22+calidad*.16,.08,.6);
  else pGol=cl(.93-reflejos*.06+calidad*.05,.75,.97);
  if(Math.random()<.055)return {gol:false,motivo:'afuera'};   // se le va por encima
  return {gol:Math.random()<pGol,motivo:acierto?'atajado':'gol'};
}
function penJugar(zona){
  const T=G.tanda;if(!T||T.fin)return;
  const a=G.clubes[T.a],b=G.clubes[T.b];
  const miClub=T.soyLocal?a:b, rivClub=T.soyLocal?b:a;
  if(T.fase==='patear'){
    const tir=penTirador(miClub,T.mios.length);
    const gkR=porteroDe(rivClub);
    const zonaGK=Math.floor(Math.random()*6);
    const r=penResolver(zona,zonaGK,tir,gkR);
    T.mios.push(r.gol?1:0);
    T.ultimo={mio:true,gol:r.gol,zona,zonaGK,nombre:tir?corto(tir.nom):'',motivo:r.motivo};
    T.fase='atajar';
  }else{
    const tirR=penTirador(rivClub,T.rivales.length);
    const gkMio=porteroDe(miClub);
    const zonaTiro=Math.floor(Math.random()*6);
    const r=penResolver(zonaTiro,zona,tirR,gkMio);
    T.rivales.push(r.gol?1:0);
    T.ultimo={mio:false,gol:r.gol,zona:zonaTiro,zonaGK:zona,nombre:tirR?corto(tirR.nom):'',motivo:r.motivo};
    T.fase='patear';
  }
  penEvaluar();
  render();
}
function penEvaluar(){
  const T=G.tanda;
  const m=T.mios.reduce((s,x)=>s+x,0), r=T.rivales.reduce((s,x)=>s+x,0);
  const nm=T.mios.length, nr=T.rivales.length;
  if(nm>=5&&nr>=5){
    if(nm===nr&&m!==r)T.fin=true;
  }else{
    /* muerte súbita no aplica aún: se define si es matemáticamente imposible alcanzar */
    const faltanM=Math.max(0,5-nm), faltanR=Math.max(0,5-nr);
    if(m>r+faltanR||r>m+faltanM)T.fin=true;
    if(nm>=5&&nr>=5&&m!==r)T.fin=true;
  }
  if(T.fin){
    T.ganador=m>r?T.a:T.b;
    T.marcador=[T.soyLocal?m:r,T.soyLocal?r:m];
  }
}
function penCerrar(){
  const T=G.tanda;if(!T)return;
  const m=T.mios.reduce((s,x)=>s+x,0), r=T.rivales.reduce((s,x)=>s+x,0);
  const res={pen:T.soyLocal?[m,r]:[r,m], ganador:T.ganador};
  G.tanda=null;ui.modal=null;
  const cb=penTandaFin;penTandaFin=null;
  if(cb)cb(res);else render();
}

function tlxNextPair(){const ev=G.eventos[G.sem],yo=G.clubes[G.yo];if(!ev)return null;if(ev.t==='liga')return (G.liga[yo.liga][ev.r]||[]).find(p=>p.includes(G.yo))||null;if(ev.t==='copa'&&G.copa)return G.copa.llaves.find(p=>p.includes(G.yo))||null;if(ev.t==='eu'){const esLigaEu=typeof ev.r==='number';for(const k of ['ucl','uel','lib','sud']){const T=torneo(k);if(T){const p=esLigaEu?((T.rondas&&T.rondas[ev.r])||[]).find(x=>x.includes(G.yo)):T.llaves.find(x=>x.includes(G.yo));if(p)return p}}}if(ev.t==='po'&&G.po)return G.po.llaves.find(p=>p.includes(G.yo))||null;return null}
function tlxRecordAuto(st,pair,comp,r){const fake={a:pair[0],b:pair[1],comp,r,eventos:st.evs,st,otros:[],otrosRes:[],salieron:[],derby:tlxDerby(pair[0],pair[1])};const old=vivo;vivo=fake;tlxAfterMatch();vivo=old}
function tlxAutoEvent(){const ev=G.eventos[G.sem];if(!ev)return false;const yo=G.clubes[G.yo];if(ev.t==='mercado'){G.mercado=true;G.sem++;mercadoIA();news('Mercado abierto','La simulación se detuvo en la ventana de fichajes.','info');return true}
 if(ev.t==='liga'){let mine=null,stMine=null;for(let l=0;l<LIGAS.length;l++){(G.liga[l][ev.r]||[]).forEach(p=>{const st=simularIA(G.clubes[p[0]],G.clubes[p[1]],'liga');if(p.includes(G.yo)){mine=p;stMine=st}})}if(mine)tlxRecordAuto(stMine,mine,'liga',ev.r);G.sem++;procesarSemana();return true}
 if(ev.t==='copa'){const T=G.copa;if(T&&T.llaves.length){const res=T.llaves.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],'copa')}));const mine=res.find(x=>x.p.includes(G.yo));resolverKO('copa',res);if(mine)tlxRecordAuto(mine.st,mine.p,'copa',ev.r)}G.sem++;procesarSemana();return true}
 if(ev.t==='eu'){
   const esLigaEu=typeof ev.r==='number';
   for(const k of ['ucl','uel','lib','sud']){
     const T=torneo(k);if(!T)continue;
     if(esLigaEu){
       if(ev.r>=T.jornadas)continue;
       const par=T.rondas[ev.r]||[];
       let mine=null,stMine=null;
       par.forEach(p=>{const st=simularIA(G.clubes[p[0]],G.clubes[p[1]],k);euAplicarLiga(T,p,st,k);
         if(p.includes(G.yo)){mine=p;stMine=st}});
       if(mine)tlxRecordAuto(stMine,mine,k,ev.r);
     }else{
       if(T.conmebol&&T.fase==='grupos'&&ev.r==='rep'){cerrarGrupos(T);continue}
       if(!T.conmebol&&T.fase==='liga'&&ev.r==='rep')cerrarFaseLiga(T);
       if(!T.llaves.length)continue;
       const res=T.llaves.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],k)}));
       const mine=res.find(x=>x.p.includes(G.yo));
       resolverKO(k,res);
       if(mine)tlxRecordAuto(mine.st,mine.p,k,ev.r);
     }
   }
   G.sem++;procesarSemana();return true}
 if(ev.t==='po'&&G.po){const res=G.po.llaves.map(p=>({p,st:simularIA(G.clubes[p[0]],G.clubes[p[1]],'po')})),mine=res.find(x=>x.p.includes(G.yo));resolverPO(res);if(mine)tlxRecordAuto(mine.st,mine.p,'po',ev.r);G.sem++;procesarSemana();return true}return false}
function tlxSimUntil(type){tlxEnsure();G.tlxBatch=true;let guard=0;while(guard++<140&&!G.fin&&!G.resumen){const ev=G.eventos[G.sem];if(!ev)break;if(type==='market'&&G.mercado)break;if(type==='market'&&ev.t==='mercado'){tlxAutoEvent();break}const p=tlxNextPair();if(type==='derby'&&p&&tlxDerby(p[0],p[1]))break;if(!tlxAutoEvent())break;const f=G.clubes[G.yo].forma;if(type==='win3'&&f.slice(-3).join('')==='VVV')break;if(type==='loss3'&&f.slice(-3).join('')==='DDD')break;if(type==='market'&&G.mercado)break}G.tlxBatch=false;guardar();render()}

tlxMarketExtra=function(){const c=G.clubes[G.yo],w=tlxWage(c),loans=G.loans.filter(l=>l.dest===G.yo||l.origen===G.yo);return '<div class="card"><h3>Presupuestos</h3><div class="g3">'+kpi(eur(c.presu),'fichajes disponibles')+kpi(eur(w),'masa salarial')+kpi(eur(c.topeSal-w),'margen salarial')+'</div></div>'+(G.watch.length?'<div class="card"><h3>Seguimiento y scouting</h3>'+G.watch.slice(0,12).map(id=>{const p=G.j[id],club=G.clubes.find(c=>c.plantilla.includes(id)),r=tlxScoutRange(p),rep=G.scouting[id];return '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>'+esc(p.nom)+'</span><span class="tag">'+(tlxScouted(p,club)?p.ov:r[0]+'–'+r[1])+'</span><span class="xs dim">'+(rep&&rep.active?'Ojeando '+Math.round(rep.progress)+'%':club?club.abr:'Libre')+'</span><button class="btn sm sp" data-a="ficha" data-id="'+id+'">Ver</button></div>'}).join('')+'</div>':'')+(loans.length?'<div class="card"><h3>Cesiones activas</h3>'+loans.map(l=>{const p=G.j[l.id],mine=l.dest===G.yo;return '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>'+esc(p.nom)+'</span><span class="xs dim">'+(mine?'Cedido aquí':'Cedido a '+G.clubes[l.dest].n)+'</span>'+(mine?'<button class="btn sm sp" data-a="tlxBuyLoan" data-id="'+p.id+'">Comprar · '+eur(l.opcion)+'</button>':'')+'</div>'}).join('')+'</div>':'')};

tlxStartReplay=function(id){tl3Ensure();const r=G.replays.find(x=>x.id==id);if(!r)return;vivo={a:r.a,b:r.b,comp:r.comp,r:r.r,min:0,fase:'1t',eventos:JSON.parse(JSON.stringify(r.eventos)),frames:JSON.parse(JSON.stringify(r.frames||[])),st:JSON.parse(JSON.stringify(r.st)),otros:[],otrosRes:[],liveOthers:[],cambios:0,vel:G.prefs.vel,timer:null,pintados:0,salieron:[],ctx:ctxDesde(r.eventos),replayMode:true,derby:r.derby?{nombre:r.derby}:null};ui.tab='partido';vivo.corre=true;vivo.timer=setInterval(tick,vivo.vel);render()};
render=function(){
 if(G)tl3Ensure();if(G&&G.tlxBatch)return;if(!G){$('#top').innerHTML='';$('#dock').innerHTML='';$('#layer').innerHTML='';$('#view').innerHTML=vPortada();return}if(G.fin==='libre'){$('#top').innerHTML='';$('#dock').innerHTML='';$('#layer').innerHTML='';$('#view').innerHTML=vLibre();return}
 const c=G.clubes[G.yo],tabs=[['panel','Panel'],['plantel','Plantel'],['tactica','Táctica'],['fichajes','Mercado'],['comps','Competición'],['club','Club'],['mundo','Mundo'],['partido','Partido']],nl=sinLeer();$('#top').innerHTML='<div class="top"><div class="top-in">'+crest(c,36)+'<div style="min-width:0"><div class="club">'+esc(c.n)+'</div><div class="meta">'+(PAIS[c.pais]||'')+' '+LIGAS[c.liga][0]+' · '+fase()+'</div></div><div class="caja"><b>'+eur(c.presu)+'</b><div class="meta">presupuesto</div></div></div><div class="nav">'+tabs.map(t=>'<button data-a="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'">'+t[1]+(t[0]==='panel'&&nl?'<span class="badge">'+nl+'</span>':'')+'</button>').join('')+'</div></div>';const V={panel:vPanel,plantel:vPlantel,tactica:vTactica,fichajes:vFichajes,comps:vComps,club:tl3ClubHTML,mundo:vMundo,partido:vPartido}[ui.tab];$('#view').innerHTML=V?V():'';$('#layer').innerHTML=ui.modal?vModal():'';$('#dock').innerHTML=vDock();if(ui.tab==='partido'&&vivo)pintarVivo()
};

/* --- Controles Tres Pilares --- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!G)return;const a=el.dataset.a,id=+el.dataset.id;if(a==='tl3Promote')tl3Promote(id);else if(a==='tl3Release')tl3ReleaseYouth(id);else if(a==='tl3AcademyUp')tl3UpgradeAcademy()});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(!el||!G)return;const a=el.dataset.a;if(a==='tl3Dev')tl3SetDev(+el.dataset.id,el.value);else if(a==='tl3AcademyFocus'){const c=G.clubes[G.yo];c.academy.focus=el.value;c.youth.forEach(id=>{if(G.j[id])G.j[id].devPlan=el.value});guardar();render()}});


/* ==========================================================================
   CONTROLES
   ========================================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const d=el.dataset,a=d.a;
  if(a==='cerrarFuera'){if(e.target.closest('.modal'))return;ui.modal=null;ui.neg=null;return render()}
  switch(a){
    case 'cerrar':ui.modal=null;ui.neg=null;render();break;
    case 'elegir':{const i=$('#dtname');nuevaPartida(+d.id,(i&&i.value.trim())||'Entrenador');break}
    case 'cargar':(async()=>{const s=await cargar();
      if(s){G=s;vivo=null;ui.tab='panel';ui.modal=null;render()}
      else aviso('Sin partidas guardadas','No hay ninguna partida guardada todavía. Elegí un club para empezar.')})();break;
    case 'reset':G=null;vivo=null;ui.modal=null;render();break;
    case 'tab':ui.tab=d.v;ui.sel=null;
      if(d.v==='panel')G.news.forEach(n=>n.leida=true);
      if(d.v==='comps'&&['ligas','clubes','traspasos','pichichis','coef'].includes(ui.sub))ui.sub='tabla';
      if(d.v==='mundo'&&!['ligas','clubes','traspasos','pichichis','coef'].includes(ui.sub))ui.sub='ligas';
      render();break;
    case 'sub':ui.sub=d.v;render();break;
    case 'lgv':ui.lgv=+d.v;render();break;
    case 'selCont':{const i=$('#dtname');if(i)ui.dtNombre=i.value;ui.selCont=d.v;ui.selLiga=null;render();break}
    case 'selLiga':{const i=$('#dtname');if(i)ui.dtNombre=i.value;ui.selLiga=+d.v;render();break}
    case 'verClub':ui.clubVer=(+d.id===-1?null:+d.id);render();break;
    case 'penZona':penJugar(+d.z);break;
    case 'penFin':penCerrar();break;
    case 'leer':G.news.forEach(n=>n.leida=true);render();break;
    case 'avanzar':avanzar();break;
    case 'cerrarMkt':G.mercado=false;ui.tab='panel';guardar();render();break;
    case 'auto':autoOnce(G.clubes[G.yo]);ui.sel=null;if(vivo&&(vivo.fase==='1t'||vivo.fase==='2t'))simularResto(vivo.min);render();break;
    case 'fpos':ui.filtroPos=d.v;render();break;
    case 'slot':{
      const yo=G.clubes[G.yo],i=+d.i;
      if(ui.sel==null)ui.sel=i;
      else if(ui.sel===i)ui.sel=null;
      else{const t=yo.once[ui.sel];yo.once[ui.sel]=yo.once[i];yo.once[i]=t;ui.sel=null}
      render();break;
    }
    case 'banco':{
      const yo=G.clubes[G.yo],id=+d.id;
      if(ui.sel==null){ui.modal={tipo:'ficha',id};render();break}
      const j=yo.once.indexOf(id);
      if(j>=0)yo.once[j]=yo.once[ui.sel];
      yo.once[ui.sel]=id;ui.sel=null;render();break;
    }
    case 'ficha':if(d.id)ui.modal={tipo:'ficha',id:+d.id},render();break;
    case 'negociar':{
      if(!G.mercado){aviso('Mercado cerrado','Solo se puede fichar en pretemporada y en enero.');break}
      ui.neg={fee:1,sal:1,prima:0,rol:'rotacion'};ui.modal={tipo:'negociar',id:+d.id};render();break;
    }
    case 'negFee':ui.neg.fee=+d.v;render();break;
    case 'negSal':ui.neg.sal=+d.v;render();break;
    case 'negPrima':ui.neg.prima=+d.v;render();break;
    case 'negRol':ui.neg.rol=d.v;render();break;
    case 'hacerOferta':ofertar(+d.id,ui.neg.fee,ui.neg.sal,ui.neg.prima||0,ui.neg.rol||'rotacion');break;
    case 'lista':{const p=G.j[+d.id];p.lista=!p.lista;render();break}
    case 'ventaYa':{const p=G.j[+d.id];vender(p.id,Math.round(p.val*.85),null);break}
    case 'capitan':G.clubes[G.yo].cap=+d.id;ui.modal=null;
      news('Nuevo capitán',G.j[+d.id].nom+' lleva el brazalete.','info');render();break;
    case 'renovar':{
      const p=G.j[+d.id],yo=G.clubes[G.yo];
      const anios=+(d.y||3);
      const costo=Math.round(p.sal*(anios===2?9:anios===4?17:anios===6?24:14));
      if(yo.presu<costo){aviso('Sin fondos','La renovación cuesta '+eur(costo)+' en primas.');break}
      yo.presu-=costo;p.ctr=Math.max(p.ctr,0)+anios;p.mor=cl(p.mor+10+anios,0,100);
      p.sal=Math.round(p.sal*(1+.05*anios));
      news('Renovación',p.nom+' firma '+anios+' temporada(s) más.','bien');ui.modal=null;guardar();render();break;
    }
    case 'renovarTodos':{
      const yo=G.clubes[G.yo];
      const pend=yo.plantilla.map(id=>G.j[id]).filter(p=>p&&p.ctr<=1)
        .sort((a,b)=>b.ov-a.ov);
      if(!pend.length){aviso('Nada que renovar','No hay contratos por vencer en tu plantel.');break}
      let hechos=0,gasto=0,sinPlata=0;
      pend.forEach(p=>{
        const costo=Math.round(p.sal*17);   // 4 temporadas
        if(yo.presu-costo<0){sinPlata++;return}
        yo.presu-=costo;gasto+=costo;p.ctr=Math.max(p.ctr,0)+4;
        p.mor=cl(p.mor+14,0,100);p.sal=Math.round(p.sal*1.20);hechos++;
      });
      news('Renovaciones en bloque',hechos+' jugador(es) firmaron 4 temporadas más por '+eur(gasto)+'.'+
        (sinPlata?' Quedaron '+sinPlata+' sin renovar por falta de presupuesto.':''),hechos?'bien':'mal');
      ui.modal=null;guardar();render();break;
    }
    case 'aceptar':{const o=(G.ofertas||[]).find(x=>x.id===+d.id);if(o)vender(o.id,o.precio,o.club);break}
    case 'rechazar':{G.ofertas=(G.ofertas||[]).filter(x=>x.id!==+d.id);
      const p=G.j[+d.id];if(p)p.mor=cl(p.mor-6,0,100);render();break}
    case 'ordenVivo':{const yo=G.clubes[G.yo];yo.tac[d.k]=d.v;G.histDec.unshift({sem:G.sem,min:vivo?vivo.min:0,k:d.k,v:d.v});if(G.histDec.length>40)G.histDec.pop();if(vivo)simularResto(vivo.min);render();break}
    case 'reunion':{const yo=G.clubes[G.yo],ps=yo.plantilla.map(id=>G.j[id]).filter(Boolean);if(d.v==='apoyo'){ps.forEach(p=>p.mor=cl(p.mor+ri(2,5),0,100));news('Reunión positiva','Respaldaste al grupo y mejoró el clima.','bien')}else if(d.v==='exigir'){ps.forEach(p=>p.mor=cl(p.mor+(p.prof>65?ri(1,4):-ri(1,5)),0,100));news('Mensaje exigente','Los profesionales respondieron; los más sensibles quedaron tensos.','info')}else{yo.once.forEach(id=>{const p=G.j[id];if(p)p.mor=cl(p.mor+5,0,100)});ps.filter(p=>!yo.once.includes(p.id)).forEach(p=>p.mor=cl(p.mor-2,0,100));news('Premio a los titulares','El once se siente respaldado, pero algunos suplentes protestan.','info')}G.vest.reunion=G.sem;guardar();render();break}
    case 'rol':{const p=G.j[+d.id];p.rol=d.v;p.promesa=d.v==='titular'?{txt:'ser titular importante',rest:12}:null;p.mor=cl(p.mor+(d.v==='titular'?8:-2),0,100);news('Rol acordado',p.nom+' acepta un rol de '+d.v+'.','info');ui.modal=null;guardar();render();break}
    case 'charla':charlaVestuario(d.v);break;
    case 'jugar':{const yo=G.clubes[G.yo];if(!onceOk(yo))autoOnce(yo);vivo.fase='1t';vivo.min=0;arrancarMitad();break}
    case 'segunda':vivo.fase='2t';vivo.min=45;arrancarMitad();break;
    case 'vel':{vivo.vel=+d.v;if(vivo.corre){clearInterval(vivo.timer);vivo.timer=setInterval(tick,vivo.vel)}render();break}
    case 'pausar':pausar();break;
    case 'reanudar':reanudar();break;
    case 'saltar':saltar();break;
    case 'finPartido':{
      if(vivo.comp==='po'){
        const res=[{p:[vivo.a,vivo.b],st:vivo.st},...(vivo.otrosRes||[])];
        const ord=G.po.llaves.map(par=>res.find(x=>x.p[0]===par[0]&&x.p[1]===par[1]));
        resolverPO(ord.filter(Boolean));G.sem++;vivo=null;
        if(G.po.campeon!=null){G.cerrada=false;return cerrarSeason()}
        procesarSemana();ui.tab='panel';render();break;
      }
      vivo=null;ui.tab='panel';render();break;
    }
    case 'sale':ui.sel=+d.i;render();break;
    case 'entra':{
      if(ui.sel==null){aviso('Elegí quién sale','Tocá primero un jugador de "en el campo".');break}
      if(vivo.cambios>=5){aviso('Sin cambios','Ya usaste los cinco cambios.');break}
      const yo=G.clubes[G.yo],sale=G.j[yo.once[ui.sel]];
      if(sale)vivo.salieron.push(sale.id);
      yo.once[ui.sel]=+d.id;vivo.cambios++;ui.sel=null;
      const min=vivo.fase==='descanso'?45:vivo.min;
      vivo.eventos.push({m:min,t:'cam',txt:'🔄 Cambio: entra '+corto(G.j[+d.id].nom)+' por '+(sale?corto(sale.nom):'—')});
      vivo.eventos.sort((x,y)=>x.m-y.m);
      if(vivo.fase==='1t'||vivo.fase==='2t')simularResto(vivo.min);
      render();break;
    }
    case 'tomar':tomarClub(+d.id);break;
    case 'nuevaTemp':nuevaTemporada();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='tac'){
    const yo=G.clubes[G.yo];yo.tac[el.dataset.k]=el.value;
    if(el.dataset.k==='form')autoOnce(yo);
    ui.sel=null;
    if(vivo&&(vivo.fase==='1t'||vivo.fase==='2t'))simularResto(vivo.min);
    render();
  }
  else if(a==='orden'){ui.ordena=el.value;render()}
  else if(a==='mpos'){ui.mkt.pos=el.value;render()}
  else if(a==='mov'){ui.mkt.ov=+el.value;render()}
  else if(a==='medad'){ui.mkt.edad=+el.value;render()}
  else if(a==='mmax'){ui.mkt.max=+el.value;render()}
  else if(a==='mliga'){ui.mkt.liga=+el.value;render()}
  else if(a==='tfliga'){ui.tf.liga=+el.value;render()}
  else if(a==='clubLiga'){ui.clubLiga=+el.value;ui.clubVer=null;render()}
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-a="buscar"]');if(!el)return;
  ui.mkt.txt=el.value;
  const pos=el.selectionStart;render();
  const n=document.querySelector('[data-a="buscar"]');
  if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal){ui.modal=null;ui.neg=null;render()}
});
render();
</script>
